<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>말랑 명화 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbe7f0; --bg2: #e3ecff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #2a2340; --bg2: #1d2236; }
  }
  :root[data-theme="dark"] { --bg: #2a2340; --bg2: #1d2236; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(160deg, var(--bg), var(--bg2));
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; border-radius: 20px; box-shadow: 0 12px 40px rgba(190, 110, 160, .28); touch-action: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="말랑 명화 벽돌깨기 게임 화면"></canvas>
<script>
(() => {
'use strict';
const W = 480, H = 720, HUD = 64, R = 8;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min((innerWidth - 12) / W, (innerHeight - 12) / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---------- artworks (public domain, via Wikimedia Commons) ----------
const ARTS = [
  {
    id: 'starry', src: 'art/starry-night.jpg',
    title: '별이 빛나는 밤', en: 'The Starry Night', artist: '빈센트 반 고흐', year: '1889',
    place: '뉴욕 현대미술관(MoMA) 소장',
    desc: '생레미 요양원 창밖의 풍경에 기억과 상상을 더해 그린 작품이에요. 소용돌이치는 붓질과 노랑·파랑의 강렬한 대비가 돋보이는 후기 인상주의의 대표작이랍니다.',
    hints: ['19세기 후반, 네덜란드 출신 화가의 작품이에요.', '소용돌이치는 밤하늘과 불꽃 같은 사이프러스 나무가 보여요.', '이 화가는 「해바라기」와 여러 점의 자화상으로도 유명해요.'],
  },
  {
    id: 'wave', src: 'art/great-wave.jpg',
    title: '가나가와 해변의 높은 파도 아래', en: 'The Great Wave off Kanagawa', artist: '가쓰시카 호쿠사이', year: '1831년경',
    place: '목판화 연작 「후지산 36경」 중 한 점',
    desc: '거대한 파도와 멀리 작게 보이는 후지산이 대비를 이루는 일본의 목판화(우키요에)예요. 고흐, 모네 같은 유럽 화가들에게도 큰 영향을 주었어요(자포니즘).',
    hints: ['19세기 일본에서 만들어진 목판화(우키요에)예요.', '파도 너머 멀리 작은 산 하나가 숨어 있어요.', '유럽 인상주의 화가들이 이 나라의 판화에 푹 빠졌었대요.'],
  },
  {
    id: 'monet', src: 'art/impression-sunrise.jpg',
    title: '인상, 해돋이', en: 'Impression, Sunrise', artist: '클로드 모네', year: '1872',
    place: '파리 마르모탕 모네 미술관 소장',
    desc: '프랑스 르아브르 항구의 아침 안개와 떠오르는 해를 빠른 붓질로 담았어요. 이 그림의 제목에서 「인상주의」라는 이름이 생겨났답니다.',
    hints: ['19세기 프랑스 화가의 작품이에요.', '안개 낀 항구 위로 주황빛 해가 떠올라요.', '이 작품의 제목에서 한 미술 사조의 이름이 나왔어요.'],
  },
];
for (const a of ARTS) { a.img = new Image(); a.img.src = a.src; }
const fixedArt = ARTS.findIndex(a => a.id === new URLSearchParams(location.search).get('art'));

// ---------- data ----------
const COLORS = {
  a: ['#ff8fa3', '#e0566f'], b: ['#ffb36b', '#e07f2c'], c: ['#ffe066', '#d6a91c'],
  d: ['#8fdc8f', '#45a85a'], e: ['#7cc4ff', '#3a8fd6'], f: ['#c5a3ff', '#8a63db'],
};
// lowercase = 1 hit, UPPERCASE = 2 hits (gold-cap tube)
const LEVELS = [
  ['aabbccdd', 'eeffaabb', 'ccddeeff'],
  ['abcdefab', 'bcdefabc', 'cdefabcd', 'defabcde'],
  ['.AA..AA.', 'AaaAAaaA', 'AaaaaaaA', '.AaaaaA.', '..AaaA..', '...AA...'],
  ['cccccccc', 'D.D.D.D.', 'eeeeeeee', '.F.F.F.F', 'aaaaaaaa', 'bbbbbbbb'],
  ['b......b', 'bb....bb', 'bbbbbbbb', 'bEbbbbEb', 'bbbAAbbb', 'bbbbbbbb', '.bbbbbb.'],
  ['..AAAA..', '.abbbba.', 'ab.bb.ba', 'abbbbbba', 'abA..Aba', '.abAAba.', '..aaaa..'],
  ['a.b.c.d.', '.e.f.a.b', 'c.d.e.f.', '.A.B.C.D', 'e.f.a.b.', '.c.d.e.f'],
  ['...AA...', '..bbbb..', '.cccccc.', 'dddddddd', 'EEEEEEEE', 'ffffffff', 'AAAAAAAA'],
  ['...AA...', '..BccB..', '.CddddC.', 'DeeEEeeD', '.FffffF.', '..AaaA..', '...BB...'],
  ['ABCDEFAB', 'abcdefab', 'CDEFABCD', 'cdefabcd', 'EFABCDEF', 'efabcdef', 'ABCDEFAB'],
];
const ROUNDS = LEVELS.length;
const BW = (W - 40 - 7 * 6) / 8, BH = 26, TOP = 96;
const PUPS = {
  life:  { col: '#ff7a9c', icon: '♥', msg: '생명 +1!' },
  wide:  { col: '#6fb8ff', icon: '↔', msg: '팔레트가 넓어졌다!' },
  multi: { col: '#b48cff', icon: '+2', msg: '붓이 늘었다!' },
  slow:  { col: '#5fd09a', icon: '~', msg: '천천히~' },
};

// ---------- state ----------
let state = 'title', score = 0, lives = 3, level = 0, combo = 0, shake = 0, levelStartScore = 0;
let best = 0;
try { best = +localStorage.getItem('mallang-art-best') || 0; } catch (e) {}
let bricks = [], balls = [], pups = [], parts = [], pops = [], splats = [], btns = [];
let wideT = 0, slowT = 0, time = 0, clearAt = 0;
let artIdx = -1, order = [];
const art = () => ARTS[Math.max(0, artIdx)];
const paddle = { x: W / 2, y: H - 70, w: 96, tw: 96, h: 18, sq: 0 };
let tx = W / 2;
const bubbles = Array.from({ length: 14 }, () => ({
  x: Math.random() * W, y: Math.random() * H, r: 6 + Math.random() * 14,
  sp: 8 + Math.random() * 18, heart: Math.random() < .4, ph: Math.random() * 6,
}));

function buildLevel(n) {
  bricks = []; splats = [];
  levelStartScore = score;
  LEVELS[n].forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.') return;
    const k = ch.toLowerCase();
    bricks.push({ x: 20 + c * (BW + 6), y: TOP + r * (BH + 8), w: BW, h: BH, col: COLORS[k],
      hp: ch !== k ? 2 : 1, wob: 0, blink: Math.random() * 4, dead: false });
  }));
}
function resetPowers() { wideT = 0; slowT = 0; paddle.tw = 96; }
function resetBall() {
  balls = [{ x: paddle.x, y: paddle.y - paddle.h / 2 - R - 1, vx: 0, vy: 0, stuck: true, trail: [], col: COLORS.e }];
  combo = 0;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startGame() {
  if (fixedArt >= 0) artIdx = fixedArt;
  else { let n; do { n = Math.floor(Math.random() * ARTS.length); } while (n === artIdx); artIdx = n; }
  order = shuffle([...Array(ROUNDS).keys()]);
  score = 0; lives = 3; level = 0;
  pups = []; resetPowers(); buildLevel(0); resetBall();
  state = 'play';
}
function retryLevel() {
  score = levelStartScore; lives = 3;
  pups = []; resetPowers(); buildLevel(level); resetBall();
  state = 'play';
}
function nextLevel() {
  level++;
  pups = []; resetPowers(); buildLevel(level); resetBall();
  state = 'play';
}
function saveBest() {
  if (score > best) { best = score; try { localStorage.setItem('mallang-art-best', best); } catch (e) {} }
}
const curSpeed = () => (330 + level * 14) * (slowT > 0 ? .7 : 1);

function launch() {
  const sp = curSpeed();
  for (const b of balls) if (b.stuck) {
    const a = (Math.random() - .5) * .6;
    b.vx = sp * Math.sin(a); b.vy = -sp * Math.cos(a); b.stuck = false;
    sfx('paddle');
  }
}

// ---------- sound ----------
let AC = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(f, d, type = 'sine', vol = .12, f2 = 0, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function sfx(n) {
  if (muted || !AC) return;
  switch (n) {
    case 'wall': tone(520, .05, 'sine', .05); break;
    case 'paddle': tone(320, .12, 'triangle', .14, 640); break;
    case 'pop': { const f = 620 + Math.min(combo, 10) * 70; tone(f, .13, 'sine', .14, f * 1.8); break; }
    case 'tough': tone(240, .1, 'square', .05, 180); break;
    case 'power': [660, 880, 1100].forEach((f, i) => tone(f, .1, 'triangle', .1, 0, i * .07)); break;
    case 'lose': tone(420, .45, 'triangle', .14, 140); break;
    case 'clear':
      [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .12, 0, i * .11));
      [1568, 2093].forEach((f, i) => tone(f, .25, 'sine', .06, 0, .6 + i * .1));
      break;
    case 'win':
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'triangle', .12, 0, i * .12));
      break;
    case 'over': [392, 330, 262].forEach((f, i) => tone(f, .28, 'triangle', .12, 0, i * .2)); break;
  }
}

// ---------- effects ----------
function burst(x, y, col, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0, max: .6 + Math.random() * .5,
      col, shape: ['drop', 'star', 'dot'][i % 3], size: 4 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 8 });
  }
}
function splat(x, y, col) {
  const blobs = Array.from({ length: 7 }, (_, i) => {
    const a = Math.random() * Math.PI * 2, d = i === 0 ? 0 : 8 + Math.random() * 14;
    return { dx: Math.cos(a) * d, dy: Math.sin(a) * d, r: i === 0 ? 11 + Math.random() * 4 : 2 + Math.random() * 4 };
  });
  splats.push({ x, y, col, blobs, life: 0 });
  if (splats.length > 40) splats.shift();
}
function confetti(n) {
  const cols = Object.values(COLORS).map(c => c[0]);
  for (let i = 0; i < n; i++) {
    parts.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 120, vy: Math.random() * 120, life: 0,
      max: 1.8 + Math.random(), col: cols[i % cols.length], shape: ['drop', 'star', 'dot'][i % 3],
      size: 5 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 8 });
  }
}
function popText(x, y, s, col = '#ff6f98') { pops.push({ x, y, s, col, life: 0 }); }

// ---------- physics ----------
function damage(k, b) {
  k.hp--; k.wob = 1;
  b.col = k.col;
  if (k.hp > 0) { score += 5; sfx('tough'); burst(k.x + k.w / 2, k.y + k.h / 2, '#ffd36b', 5); return; }
  k.dead = true; combo++;
  const pts = 10 + (combo - 1) * 5;
  score += pts;
  sfx('pop');
  shake = Math.min(shake + 2, 6);
  burst(k.x + k.w / 2, k.y + k.h / 2, k.col[0], 12);
  splat(k.x + k.w / 2, k.y + k.h / 2, k.col[0]);
  popText(k.x + k.w / 2, k.y, '+' + pts + (combo > 2 ? ` ${combo}콤보!` : ''));
  if (Math.random() < .17) {
    const types = Object.keys(PUPS);
    pups.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, type: types[Math.floor(Math.random() * types.length)], t: 0 });
  }
}
function hitBrick(b, k) {
  const cx = Math.max(k.x, Math.min(b.x, k.x + k.w)), cy = Math.max(k.y, Math.min(b.y, k.y + k.h));
  const dx = b.x - cx, dy = b.y - cy;
  if (dx * dx + dy * dy > R * R) return false;
  const left = b.x < k.x + k.w / 2, above = b.y < k.y + k.h / 2;
  const ox = left ? b.x + R - k.x : k.x + k.w - (b.x - R);
  const oy = above ? b.y + R - k.y : k.y + k.h - (b.y - R);
  if (ox < oy) { b.vx = left ? -Math.abs(b.vx) : Math.abs(b.vx); b.x += left ? -ox : ox; }
  else { b.vy = above ? -Math.abs(b.vy) : Math.abs(b.vy); b.y += above ? -oy : oy; }
  damage(k, b);
  return true;
}
function updBall(b, dt) {
  if (b.stuck) { b.x = paddle.x; b.y = paddle.y - paddle.h / 2 - R - 1; return; }
  const sp = curSpeed(), m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / m * sp; b.vy = b.vy / m * sp;
  const steps = Math.ceil(sp * dt / 4), h = dt / steps;
  for (let i = 0; i < steps; i++) {
    b.x += b.vx * h; b.y += b.vy * h;
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); sfx('wall'); }
    if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); sfx('wall'); }
    if (b.y < HUD + R) { b.y = HUD + R; b.vy = Math.abs(b.vy); sfx('wall'); }
    const p = paddle, px = p.x - p.w / 2, py = p.y - p.h / 2;
    if (b.vy > 0 && b.y + R >= py && b.y - R <= py + p.h && b.x >= px - R && b.x <= px + p.w + R) {
      const t = Math.max(-1, Math.min(1, (b.x - p.x) / (p.w / 2)));
      const a = t * 1.05;
      b.vx = sp * Math.sin(a); b.vy = -sp * Math.cos(a); b.y = py - R;
      p.sq = 1; combo = 0; sfx('paddle');
    }
    for (const k of bricks) if (!k.dead && hitBrick(b, k)) break;
    if (b.y > H + R * 2) { b.lost = true; return; }
  }
}
function applyPup(type, x, y) {
  sfx('power');
  popText(x, y - 20, PUPS[type].msg, PUPS[type].col);
  burst(x, y, PUPS[type].col, 10);
  if (type === 'life') lives = Math.min(lives + 1, 5);
  if (type === 'wide') { wideT = 12; paddle.tw = 150; }
  if (type === 'slow') slowT = 10;
  if (type === 'multi') {
    const src = balls.find(b => !b.stuck);
    if (!src) { launch(); return; }
    const sp = curSpeed(), base = Math.atan2(src.vx, -src.vy);
    for (const d of [-.45, .45]) {
      const a = Math.max(-1.05, Math.min(1.05, base + d));
      balls.push({ x: src.x, y: src.y, vx: sp * Math.sin(a), vy: -sp * Math.cos(a), stuck: false, trail: [], col: src.col });
    }
  }
}

// ---------- update ----------
const keys = {};
function update(dt) {
  time += dt;
  for (const b of bubbles) { b.y -= b.sp * dt; if (b.y < -30) { b.y = H + 30; b.x = Math.random() * W; } }
  for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.rot += p.vr * dt; }
  parts = parts.filter(p => p.life < p.max);
  for (const p of pops) { p.life += dt; p.y -= 40 * dt; }
  pops = pops.filter(p => p.life < .9);
  for (const s of splats) s.life += dt;
  splats = splats.filter(s => s.life < 5);
  shake = Math.max(0, shake - dt * 25);
  for (const k of bricks) { k.wob = Math.max(0, k.wob - dt * 3); k.blink += dt; }
  paddle.sq = Math.max(0, paddle.sq - dt * 5);
  if (state !== 'play') return;

  if (keys.left) tx -= 560 * dt;
  if (keys.right) tx += 560 * dt;
  if (wideT > 0 && (wideT -= dt) <= 0) paddle.tw = 96;
  if (slowT > 0) slowT -= dt;
  paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 10);
  tx = Math.max(paddle.w / 2 + 6, Math.min(W - paddle.w / 2 - 6, tx));
  paddle.x += (tx - paddle.x) * Math.min(1, dt * 22);

  for (const b of balls) {
    updBall(b, dt);
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 12) b.trail.shift();
  }
  balls = balls.filter(b => !b.lost);

  for (const u of pups) {
    u.t += dt; u.y += 130 * dt;
    const p = paddle;
    if (u.y + 13 > p.y - p.h / 2 && u.y - 13 < p.y + p.h / 2 && Math.abs(u.x - p.x) < p.w / 2 + 13) {
      u.got = true; applyPup(u.type, u.x, u.y);
    }
  }
  pups = pups.filter(u => !u.got && u.y < H + 20);

  if (balls.length === 0) {
    lives--; sfx('lose'); shake = 8; resetPowers(); pups = [];
    if (lives <= 0) { state = 'over'; saveBest(); setTimeout(() => sfx('over'), 300); }
    else resetBall();
  }
  if (state === 'play' && bricks.every(k => k.dead)) {
    pups = []; score += 100; clearAt = time; saveBest();
    if (level === ROUNDS - 1) { state = 'win'; confetti(120); sfx('win'); }
    else { state = 'clear'; confetti(50); sfx('clear'); }
  }
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * .45, x - s * .45, y - s * 1.1, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.1, x + s * 1.1, y - s * .45, x, y + s * .35);
  ctx.closePath();
}
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function dropPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - s * 1.3);
  ctx.bezierCurveTo(x + s * .9, y - s * .2, x + s, y + s, x, y + s);
  ctx.bezierCurveTo(x - s, y + s, x - s * .9, y - s * .2, x, y - s * 1.3);
  ctx.closePath();
}
function text(s, x, y, size, col, align = 'center', outline = null) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = size / 5; ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const lines = []; let line = '';
  for (const word of s.split(' ')) {

function drawPainting(cx, y, maxW, maxH, shown, newest = -1) {

function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', e => { tx = toCanvas(e).x; });
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = toCanvas(e);
  if (state === 'play' || state === 'pause') {
    if (Math.hypot(p.x - BTN.mute.x, p.y - BTN.mute.y) < 18) { muted = !muted; return; }
    if (Math.hypot(p.x - BTN.pause.x, p.y - BTN.pause.y) < 18) { togglePause(); return; }
  }
  for (const b of btns) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.act(); return; }
  if (state === 'play') tx = p.x;
  action();
});
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') action();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
addEventListener('blur', () => { keys.left = keys.right = false; });

// ---------- loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
