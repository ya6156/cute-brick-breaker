<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>말랑 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbe7f0; --bg2: #e3ecff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #2a2340; --bg2: #1d2236; }
  }
  :root[data-theme="dark"] { --bg: #2a2340; --bg2: #1d2236; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(160deg, var(--bg), var(--bg2));
    display: flex; align-items: center; justify-content: center;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; border-radius: 20px; box-shadow: 0 12px 40px rgba(190, 110, 160, .28); touch-action: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="말랑 벽돌깨기 게임 화면"></canvas>
<script>
(() => {
'use strict';
const W = 480, H = 720, HUD = 64, R = 8;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min((innerWidth - 12) / W, (innerHeight - 12) / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---------- data ----------
const COLORS = {
  a: ['#ffb3c7', '#ef7d9d'], b: ['#ffd1a3', '#eea05d'], c: ['#fff0a0', '#e2bb3a'],
  d: ['#b9f0c9', '#5cc185'], e: ['#b5dcff', '#5ea6e6'], f: ['#d6c4ff', '#9a7ce6'],
};
// lowercase = 1 hit, UPPERCASE = 2 hits (frosted cake brick)
const LEVELS = [
  ['aabbccdd', 'aabbccdd', 'eeffaabb', 'eeffaabb'],
  ['.AA..AA.', 'AaaAAaaA', 'AaaaaaaA', '.AaaaaA.', '..AaaA..', '...AA...'],
  ['cccccccc', 'D.D.D.D.', 'eeeeeeee', '.F.F.F.F', 'aaaaaaaa', 'bbbbbbbb'],
  ['b......b', 'bb....bb', 'bbbbbbbb', 'bEbbbbEb', 'bbbAAbbb', 'bbbbbbbb', '.bbbbbb.'],
  ['...AA...', '..bbbb..', '.cccccc.', 'dddddddd', 'EEEEEEEE', 'ffffffff', 'AAAAAAAA'],
];
const BW = (W - 40 - 7 * 6) / 8, BH = 26, TOP = 96;
const PUPS = {
  life:  { col: '#ff7a9c', icon: '♥', msg: '생명 +1!' },
  wide:  { col: '#6fb8ff', icon: '↔', msg: '쭈욱~ 넓어졌다!' },
  multi: { col: '#b48cff', icon: '+2', msg: '공이 늘었다!' },
  slow:  { col: '#5fd09a', icon: '~', msg: '천천히~' },
};

// ---------- state ----------
let state = 'title', score = 0, lives = 3, level = 0, combo = 0, shake = 0;
let best = 0;
try { best = +localStorage.getItem('mallang-best') || 0; } catch (e) {}
let bricks = [], balls = [], pups = [], parts = [], pops = [];
let wideT = 0, slowT = 0, time = 0;
const paddle = { x: W / 2, y: H - 70, w: 96, tw: 96, h: 18, sq: 0 };
let tx = W / 2;
const bubbles = Array.from({ length: 14 }, () => ({
  x: Math.random() * W, y: Math.random() * H, r: 6 + Math.random() * 14,
  sp: 8 + Math.random() * 18, heart: Math.random() < .4, ph: Math.random() * 6,
}));

function buildLevel(n) {
  bricks = [];
  LEVELS[n].forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.') return;
    const k = ch.toLowerCase();
    const hp = ch !== k ? 2 : 1;
    bricks.push({ x: 20 + c * (BW + 6), y: TOP + r * (BH + 8), w: BW, h: BH, col: COLORS[k],
      hp, wob: 0, blink: Math.random() * 4, dead: false });
  }));
}
function resetPowers() { wideT = 0; slowT = 0; paddle.tw = 96; }
function resetBall() {
  balls = [{ x: paddle.x, y: paddle.y - paddle.h / 2 - R - 1, vx: 0, vy: 0, stuck: true, trail: [] }];
  combo = 0;
}
function startGame() {
  score = 0; lives = 3; level = 0;
  pups = []; resetPowers(); buildLevel(0); resetBall();
  state = 'play';
}
function nextLevel() {
  level++;
  if (level >= LEVELS.length) { state = 'win'; saveBest(); confetti(80); sfx('clear'); return; }
  pups = []; resetPowers(); buildLevel(level); resetBall();
  state = 'play';
}
function saveBest() {
  if (score > best) { best = score; try { localStorage.setItem('mallang-best', best); } catch (e) {} }
}
const curSpeed = () => (330 + level * 25) * (slowT > 0 ? .7 : 1);

function launch() {
  const sp = curSpeed();
  for (const b of balls) if (b.stuck) {
    const a = (Math.random() - .5) * .6;
    b.vx = sp * Math.sin(a); b.vy = -sp * Math.cos(a); b.stuck = false;
    sfx('paddle');
  }
}

// ---------- sound ----------
let AC = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(f, d, type = 'sine', vol = .12, f2 = 0, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function sfx(n) {
  if (muted || !AC) return;
  switch (n) {
    case 'wall': tone(520, .05, 'sine', .05); break;
    case 'paddle': tone(320, .12, 'triangle', .14, 640); break;
    case 'pop': { const f = 620 + Math.min(combo, 10) * 70; tone(f, .13, 'sine', .14, f * 1.8); break; }
    case 'tough': tone(240, .1, 'square', .05, 180); break;
    case 'power': [660, 880, 1100].forEach((f, i) => tone(f, .1, 'triangle', .1, 0, i * .07)); break;
    case 'lose': tone(420, .45, 'triangle', .14, 140); break;
    case 'clear': [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .12, 0, i * .11)); break;
    case 'over': [392, 330, 262].forEach((f, i) => tone(f, .28, 'triangle', .12, 0, i * .2)); break;
  }
}

// ---------- effects ----------
function burst(x, y, col, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0, max: .6 + Math.random() * .5,
      col, shape: ['heart', 'star', 'dot'][i % 3], size: 4 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 8 });
  }
}
function confetti(n) {
  const cols = Object.values(COLORS).map(c => c[1]);
  for (let i = 0; i < n; i++) {
    parts.push({ x: Math.random() * W, y: HUD - 10, vx: (Math.random() - .5) * 120, vy: Math.random() * 120, life: 0,
      max: 1.6 + Math.random(), col: cols[i % cols.length], shape: ['heart', 'star', 'dot'][i % 3],
      size: 5 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 8 });
  }
}
function popText(x, y, s, col = '#ff6f98') { pops.push({ x, y, s, col, life: 0 }); }

// ---------- physics ----------
function damage(k) {
  k.hp--; k.wob = 1;
  if (k.hp > 0) { score += 5; sfx('tough'); burst(k.x + k.w / 2, k.y + k.h / 2, '#ffffff', 5); return; }
  k.dead = true; combo++;
  const pts = 10 + (combo - 1) * 5;
  score += pts;
  sfx('pop');
  shake = Math.min(shake + 2, 6);
  burst(k.x + k.w / 2, k.y + k.h / 2, k.col[1], 12);
  popText(k.x + k.w / 2, k.y, '+' + pts + (combo > 2 ? ` ${combo}콤보!` : ''));
  if (Math.random() < .17) {
    const types = Object.keys(PUPS);
    pups.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, type: types[Math.floor(Math.random() * types.length)], t: 0 });
  }
}
function hitBrick(b, k) {
  const cx = Math.max(k.x, Math.min(b.x, k.x + k.w)), cy = Math.max(k.y, Math.min(b.y, k.y + k.h));
  const dx = b.x - cx, dy = b.y - cy;
  if (dx * dx + dy * dy > R * R) return false;
  const left = b.x < k.x + k.w / 2, above = b.y < k.y + k.h / 2;
  const ox = left ? b.x + R - k.x : k.x + k.w - (b.x - R);
  const oy = above ? b.y + R - k.y : k.y + k.h - (b.y - R);
  if (ox < oy) { b.vx = left ? -Math.abs(b.vx) : Math.abs(b.vx); b.x += left ? -ox : ox; }
  else { b.vy = above ? -Math.abs(b.vy) : Math.abs(b.vy); b.y += above ? -oy : oy; }
  damage(k);
  return true;
}
function updBall(b, dt) {
  if (b.stuck) { b.x = paddle.x; b.y = paddle.y - paddle.h / 2 - R - 1; return; }
  const sp = curSpeed(), m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / m * sp; b.vy = b.vy / m * sp;
  const steps = Math.ceil(sp * dt / 4), h = dt / steps;
  for (let i = 0; i < steps; i++) {
    b.x += b.vx * h; b.y += b.vy * h;
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); sfx('wall'); }
    if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); sfx('wall'); }
    if (b.y < HUD + R) { b.y = HUD + R; b.vy = Math.abs(b.vy); sfx('wall'); }
    const p = paddle, px = p.x - p.w / 2, py = p.y - p.h / 2;
    if (b.vy > 0 && b.y + R >= py && b.y - R <= py + p.h && b.x >= px - R && b.x <= px + p.w + R) {
      const t = Math.max(-1, Math.min(1, (b.x - p.x) / (p.w / 2)));
      const a = t * 1.05;
      b.vx = sp * Math.sin(a); b.vy = -sp * Math.cos(a); b.y = py - R;
      p.sq = 1; combo = 0; sfx('paddle');
    }
    for (const k of bricks) if (!k.dead && hitBrick(b, k)) break;
    if (b.y > H + R * 2) { b.lost = true; return; }
  }
}
function applyPup(type, x, y) {
  sfx('power');
  popText(x, y - 20, PUPS[type].msg, PUPS[type].col);
  burst(x, y, PUPS[type].col, 10);
  if (type === 'life') lives = Math.min(lives + 1, 5);
  if (type === 'wide') { wideT = 12; paddle.tw = 150; }
  if (type === 'slow') slowT = 10;
  if (type === 'multi') {
    const src = balls.find(b => !b.stuck);
    if (!src) { launch(); return; }
    const sp = curSpeed(), base = Math.atan2(src.vx, -src.vy);
    for (const d of [-.45, .45]) {
      const a = Math.max(-1.05, Math.min(1.05, base + d));
      balls.push({ x: src.x, y: src.y, vx: sp * Math.sin(a), vy: -sp * Math.cos(a), stuck: false, trail: [] });
    }
  }
}

// ---------- update ----------
const keys = {};
function update(dt) {
  time += dt;
  for (const b of bubbles) { b.y -= b.sp * dt; if (b.y < -30) { b.y = H + 30; b.x = Math.random() * W; } }
  for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.rot += p.vr * dt; }
  parts = parts.filter(p => p.life < p.max);
  for (const p of pops) { p.life += dt; p.y -= 40 * dt; }
  pops = pops.filter(p => p.life < .9);
  shake = Math.max(0, shake - dt * 25);
  for (const k of bricks) { k.wob = Math.max(0, k.wob - dt * 3); k.blink += dt; }
  paddle.sq = Math.max(0, paddle.sq - dt * 5);
  if (state !== 'play') return;

  if (keys.left) tx -= 560 * dt;
  if (keys.right) tx += 560 * dt;
  if (wideT > 0 && (wideT -= dt) <= 0) paddle.tw = 96;
  if (slowT > 0) slowT -= dt;
  paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 10);
  tx = Math.max(paddle.w / 2 + 6, Math.min(W - paddle.w / 2 - 6, tx));
  paddle.x += (tx - paddle.x) * Math.min(1, dt * 22);

  for (const b of balls) {
    updBall(b, dt);
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 8) b.trail.shift();
  }
  balls = balls.filter(b => !b.lost);

  for (const u of pups) {
    u.t += dt; u.y += 130 * dt;
    const p = paddle;
    if (u.y + 13 > p.y - p.h / 2 && u.y - 13 < p.y + p.h / 2 && Math.abs(u.x - p.x) < p.w / 2 + 13) {
      u.got = true; applyPup(u.type, u.x, u.y);
    }
  }
  pups = pups.filter(u => !u.got && u.y < H + 20);

  if (balls.length === 0) {
    lives--; sfx('lose'); shake = 8; resetPowers(); pups = [];
    if (lives <= 0) { state = 'over'; saveBest(); setTimeout(() => sfx('over'), 300); }
    else resetBall();
  }
  if (state === 'play' && bricks.every(k => k.dead)) {
    state = 'clear'; pups = []; sfx('clear'); confetti(50);
    score += 100; popText(W / 2, H / 2 + 70, '보너스 +100', '#ff8fb0');
  }
}

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * .45, x - s * .45, y - s * 1.1, x, y - s * .45);
  ctx.bezierCurveTo(x + s * .45, y - s * 1.1, x + s * 1.1, y - s * .45, x, y + s * .35);
  ctx.closePath();
}
function starPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function text(s, x, y, size, col, align = 'center', outline = null) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = size / 5; ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function face(x, y, mood, blink, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.fillStyle = ctx.strokeStyle = '#5a3a4a'; ctx.lineWidth = 1.7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (mood === 'ouch') {
    ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(-6, 1); ctx.lineTo(-10, 4);
    ctx.moveTo(10, -2); ctx.lineTo(6, 1); ctx.lineTo(10, 4); ctx.stroke();
  } else if (blink || mood === 'happy') {
    ctx.beginPath(); ctx.arc(-8, 2, 2.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(8, 2, 2.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-8, 0, 2.3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 0, 2.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7.3, -.8, .8, 0, 7); ctx.arc(8.7, -.8, .8, 0, 7); ctx.fill();
  }
  ctx.beginPath();
  if (mood === 'ouch') ctx.arc(0, 6, 2, 0, 7);
  else { ctx.arc(-1.8, 3.5, 1.8, .2, Math.PI - .2); ctx.moveTo(3.4, 4.1); ctx.arc(1.8, 3.5, 1.8, .2, Math.PI - .2); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,110,150,.4)';
  ctx.beginPath(); ctx.ellipse(-14, 5, 3.8, 2.4, 0, 0, 7); ctx.ellipse(14, 5, 3.8, 2.4, 0, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- drawing ----------
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fff3f8'); g.addColorStop(1, '#eaf2ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const b of bubbles) {
    ctx.globalAlpha = .5;
    const x = b.x + Math.sin(time + b.ph) * 8;
    if (b.heart) { ctx.fillStyle = '#ffd6e5'; heartPath(x, b.y, b.r * .7); ctx.fill(); }
    else { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawBrick(k) {
  const s = 1 + Math.sin(k.wob * 14) * .1 * k.wob;
  ctx.save();
  ctx.translate(k.x + k.w / 2, k.y + k.h / 2); ctx.scale(s, 2 - s);
  const x = -k.w / 2, y = -k.h / 2;
  ctx.fillStyle = 'rgba(170,110,150,.16)'; rr(x, y + 3, k.w, k.h, 10); ctx.fill();
  ctx.fillStyle = k.col[0]; rr(x, y, k.w, k.h, 10); ctx.fill();
  if (k.hp > 1) {
    ctx.save(); rr(x, y, k.w, k.h, 10); ctx.clip();
    ctx.fillStyle = '#fffafc';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + k.w, y); ctx.lineTo(x + k.w, y + 7);
    for (let i = 4; i >= 0; i--) {
      const cx = x + (i + .5) * k.w / 5;
      ctx.quadraticCurveTo(cx + k.w / 10, y + 7, cx, y + (i % 2 ? 12 : 9));
      ctx.quadraticCurveTo(cx - k.w / 10, y + 7, cx - k.w / 10, y + 7);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = k.col[1];
    for (let i = 0; i < 4; i++) { ctx.fillRect(x + 8 + i * 11, y + 3, 3, 1.6); }
    ctx.restore();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(x + 6, y + 3, k.w - 12, 5, 3); ctx.fill();
  }
  ctx.lineWidth = 2; ctx.strokeStyle = k.col[1]; rr(x, y, k.w, k.h, 10); ctx.stroke();
  face(0, 3, k.wob > .35 ? 'ouch' : 'idle', (k.blink % 4) < .13, .82);
  ctx.restore();
}
function drawPaddle() {
  const p = paddle, sx = 1 + p.sq * .1, sy = 1 - p.sq * .25;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(sx, sy);
  const w = p.w, h = p.h;
  for (const ex of [-w / 2 + 16, w / 2 - 16]) {
    ctx.save(); ctx.translate(ex, -h / 2); ctx.rotate(ex < 0 ? -.25 : .25);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#ee87a8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -9, 5, 11, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffc2d6'; ctx.beginPath(); ctx.ellipse(0, -9, 2.2, 7, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(170,110,150,.18)'; rr(-w / 2, -h / 2 + 4, w, h, h / 2); ctx.fill();
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, '#ffc4d8'); g.addColorStop(1, '#ff97bb');
  ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = '#e8739a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; rr(-w / 2 + 10, -h / 2 + 3, w - 20, 4, 2); ctx.fill();
  face(0, 1, p.sq > .4 ? 'happy' : 'idle', (time % 3.5) < .12, .75);
  ctx.restore();
}
function drawBall(b) {
  b.trail.forEach((t, i) => {
    ctx.globalAlpha = (i / b.trail.length) * .3;
    ctx.fillStyle = '#ffd36b';
    ctx.beginPath(); ctx.arc(t.x, t.y, R * (i / b.trail.length), 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff4b0'; ctx.strokeStyle = '#efb44a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a3a4a';
  ctx.beginPath(); ctx.arc(b.x - 2.8, b.y - .5, 1.2, 0, 7); ctx.arc(b.x + 2.8, b.y - .5, 1.2, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,150,.5)';
  ctx.beginPath(); ctx.arc(b.x - 4.6, b.y + 2.2, 1.4, 0, 7); ctx.arc(b.x + 4.6, b.y + 2.2, 1.4, 0, 7); ctx.fill();
}
function drawPup(u) {
  const P = PUPS[u.type], y = u.y + Math.sin(u.t * 6) * 2;
  ctx.fillStyle = 'rgba(170,110,150,.2)'; ctx.beginPath(); ctx.arc(u.x, y + 3, 13, 0, 7); ctx.fill();
  ctx.fillStyle = P.col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(u.x, y, 13, 0, 7); ctx.fill(); ctx.stroke();
  text(P.icon, u.x, y + 1, u.type === 'multi' ? 13 : 16, '#fff');
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = 1 - p.life / p.max;
    ctx.fillStyle = p.col;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.shape === 'heart') { heartPath(0, 0, p.size); ctx.fill(); }
    else if (p.shape === 'star') { starPath(0, 0, p.size); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(0, 0, p.size * .6, 0, 7); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    ctx.globalAlpha = 1 - p.life / .9;
    text(p.s, p.x, p.y, 17, p.col, 'center', '#fff');
  }
  ctx.globalAlpha = 1;
}
const BTN = { mute: { x: W - 32, y: 32 }, pause: { x: W - 66, y: 32 } };
function drawHud() {
  ctx.fillStyle = 'rgba(255,255,255,.75)'; rr(10, 10, W - 20, 44, 18); ctx.fill();
  ctx.strokeStyle = '#ffd0e0'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffc94d'; starPath(32, 32, 9); ctx.fill();
  text(String(score), 48, 33, 22, '#6a4a5a', 'left');
  text(`Lv.${level + 1}`, 190, 33, 20, '#9a7ce6');
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i < lives ? '#ff7a9c' : '#f3dbe4';
    heartPath(250 + i * 22, 34, 9); ctx.fill();
  }
  for (const [k, b] of Object.entries(BTN)) {
    ctx.fillStyle = '#ffe3ee'; ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, 7); ctx.fill();
    if (k === 'mute') {
      text('♪', b.x, b.y + 1, 17, muted ? '#d9b8c6' : '#e8739a');
      if (muted) { ctx.strokeStyle = '#e8739a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.x - 8, b.y + 8); ctx.lineTo(b.x + 8, b.y - 8); ctx.stroke(); }
    } else {
      ctx.fillStyle = '#e8739a';
      if (state === 'pause') { ctx.beginPath(); ctx.moveTo(b.x - 4, b.y - 6); ctx.lineTo(b.x + 6, b.y); ctx.lineTo(b.x - 4, b.y + 6); ctx.fill(); }
      else { rr(b.x - 6, b.y - 6, 4, 12, 2); ctx.fill(); rr(b.x + 2, b.y - 6, 4, 12, 2); ctx.fill(); }
    }
  }
  let bx = 20;
  const badge = (label, t, col) => {
    ctx.fillStyle = col; rr(bx, H - 30, 92, 20, 10); ctx.fill();
    text(`${label} ${Math.ceil(t)}`, bx + 46, H - 19, 14, '#fff');
    bx += 100;
  };
  if (wideT > 0) badge('넓게', wideT, PUPS.wide.col);
  if (slowT > 0) badge('느리게', slowT, PUPS.slow.col);
}
function card(h) {
  ctx.fillStyle = 'rgba(255,240,246,.55)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.94)'; rr(50, H / 2 - h / 2, W - 100, h, 28); ctx.fill();
  ctx.strokeStyle = '#ffc2d6'; ctx.lineWidth = 3; ctx.stroke();
}
function button(label, y) {
  const pulse = 1 + Math.sin(time * 4) * .03;
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(pulse, pulse);
  ctx.fillStyle = '#e8739a'; rr(-90, -22 + 4, 180, 44, 22); ctx.fill();
  ctx.fillStyle = '#ff97bb'; rr(-90, -22, 180, 44, 22); ctx.fill();
  text(label, 0, 1, 22, '#fff');
  ctx.restore();
}
function drawOverlay() {
  const cy = H / 2;
  if (state === 'title') {
    ctx.fillStyle = 'rgba(255,240,246,.4)'; ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(time * 3) * 6;
    const cols = ['a', 'c', 'd', 'e', 'f'];
    cols.forEach((c, i) => {
      const k = { x: 52 + i * 78, y: 170 + Math.sin(time * 3 + i) * 8, w: 64, h: 32, col: COLORS[c], hp: i === 2 ? 2 : 1,
        wob: 0, blink: (time + i * .7) % 4 };
      drawBrick(k);
    });
    text('말랑말랑', W / 2, 262 + bob, 46, '#ff7aa2', 'center', '#fff');
    text('벽돌깨기', W / 2, 318 + bob, 58, '#9a7ce6', 'center', '#fff');
    button('▶ 시작하기', 420);
    text('마우스·터치로 움직이고, 탭하면 발사!', W / 2, 490, 17, '#7a5a6a');
    text('← → 이동 · 스페이스 발사 · P 일시정지 · M 소리', W / 2, 518, 14, '#a08898');
    text('하얀 크림 벽돌은 두 번 맞아야 깨져요', W / 2, 546, 14, '#a08898');
    if (best) text(`최고 점수 ★ ${best}`, W / 2, 590, 18, '#e8a33a');
  } else if (state === 'play') {
    if (balls.some(b => b.stuck)) {
      ctx.globalAlpha = .6 + Math.sin(time * 5) * .4;
      text('탭하거나 스페이스로 발사!', W / 2, paddle.y + 46, 18, '#e8739a', 'center', '#fff');
      ctx.globalAlpha = 1;
    }
  } else if (state === 'pause') {
    card(200);
    text('잠깐 쉬는 중 zZ', W / 2, cy - 40, 30, '#9a7ce6');
    button('계속하기', cy + 40);
  } else if (state === 'clear') {
    card(240);
    text(`레벨 ${level + 1} 클리어!`, W / 2, cy - 60, 34, '#ff7aa2');
    text(`점수 ★ ${score}`, W / 2, cy - 15, 20, '#7a5a6a');
    button(level + 1 >= LEVELS.length ? '마지막 결과 보기' : '다음 레벨 ▶', cy + 60);
  } else if (state === 'over') {
    card(280);
    text('앗, 아쉬워요 ㅠㅠ', W / 2, cy - 85, 32, '#9a7ce6');
    text(`점수 ★ ${score}`, W / 2, cy - 35, 24, '#7a5a6a');
    text(`최고 점수 ${best}`, W / 2, cy, 17, '#e8a33a');
    button('다시 하기', cy + 75);
  } else if (state === 'win') {
    card(300);
    text('모두 깼어요!', W / 2, cy - 95, 38, '#ff7aa2');
    text('벽돌 친구들이 놀라서 도망갔어요 ♥', W / 2, cy - 50, 16, '#9a7ce6');
    text(`최종 점수 ★ ${score}`, W / 2, cy - 5, 24, '#7a5a6a');
    text(`최고 점수 ${best}`, W / 2, cy + 28, 17, '#e8a33a');
    button('처음부터 다시', cy + 90);
  }
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  drawBg();
  if (state !== 'title') {
    for (const k of bricks) if (!k.dead) drawBrick(k);
    for (const u of pups) drawPup(u);
    drawPaddle();
    for (const b of balls) drawBall(b);
  }
  drawParts();
  ctx.restore();
  if (state !== 'title') drawHud();
  drawOverlay();
}

// ---------- input ----------
function action() {
  initAudio();
  if (state === 'title' || state === 'over' || state === 'win') startGame();
  else if (state === 'play') launch();
  else if (state === 'pause') state = 'play';
  else if (state === 'clear') nextLevel();
}
function togglePause() {
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
}
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointermove', e => { tx = toCanvas(e).x; });
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = toCanvas(e);
  if (state !== 'title') {
    if (Math.hypot(p.x - BTN.mute.x, p.y - BTN.mute.y) < 18) { muted = !muted; return; }
    if (Math.hypot(p.x - BTN.pause.x, p.y - BTN.pause.y) < 18) { togglePause(); return; }
  }
  if (state === 'play') tx = p.x;
  action();
});
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') action();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
addEventListener('blur', () => { keys.left = keys.right = false; });

// ---------- loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
